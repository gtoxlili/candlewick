name: Build Candlewick

# Builds the installers and releases from main on its own. A push to main
# that changes the app increments the patch version. A manual run can
# explicitly select a minor release. Both create a `chore: release vX.Y.Z`
# commit, a GitHub release with the installers, and the tag that comes with
# it. Nobody maintains versions or tags by hand. Pull requests build and
# test the Windows installer, and release nothing.
#
# Signing: the macOS build only runs for a release, in the `release`
# environment, which main alone may use: it holds the Apple secrets, so no
# other branch or pull request ever sees them. The Windows installer is not
# code-signed yet; it earns a SmartScreen prompt on first install. Both the
# macOS update archive and the Windows installer carry the updater's
# minisign signature. See docs/release.md.
#
# Secrets (environment `release`):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   TAURI_SIGNING_PRIVATE_KEY (the updater's private key; the packager reads
#   it as CARGO_PACKAGER_SIGN_PRIVATE_KEY)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (main only; an unfinished release keeps its version)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
  push:
    branches: [main]
    paths: &app
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "Info.plist"
      - "icons/**"
      - "locales/**"
      - "assets/**"
      - "rustfmt.toml"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths: *app

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What counts as the app when deciding whether to release and what goes
  # into the notes. The workflow itself is not in it: changing only the
  # workflow builds, and releases nothing.
  APP_PATHS: src Cargo.toml Cargo.lock build.rs Info.plist icons locales assets

jobs:
  # Works out whether this push is a release and which version it is, and
  # if so writes that version into the repository first, so the builds below
  # are made from a commit that says what it is.
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The release commit.
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tags and the whole range since the last one.
          fetch-depth: 0
          fetch-tags: true

      # Automatic releases always bump patch, regardless of commit type.
      # A workflow_dispatch on main can explicitly bump minor. When the
      # files already hold a version no tag names (a hand bump, or a release
      # whose run did not finish), that version ships as it is.
      - name: Decide
        id: decide
        shell: bash
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected version ${current}"; exit 1; }
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != "refs/heads/main" || ( "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ) ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump=patch
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$RELEASE_BUMP" in
              patch|minor) bump="$RELEASE_BUMP" ;;
              *) echo "::error::unsupported version bump"; exit 1 ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
            # shellcheck disable=SC2086
            subjects=$(git log "v${current}..HEAD" --format=%s -- $APP_PATHS)
            if [[ "$GITHUB_EVENT_NAME" == "push" && -z "$subjects" ]]; then
              echo "::notice::nothing in the app changed since v${current}; not releasing"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "$current"
            if [[ "$bump" == "minor" ]]; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="${major}.${minor}.${patch}"
          else
            next="$current"
          fi

          if [[ "$next" != "$current" ]]; then
            sed -i "s/^version = \"${current}\"$/version = \"${next}\"/" Cargo.toml
            sed -i "/^name = \"candlewick\"$/{n;s/^version = \"${current}\"$/version = \"${next}\"/}" Cargo.lock
            # Every file must now say it; a pattern that missed fails here.
            [[ "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" == "$next" ]]
            grep -A1 -x 'name = "candlewick"' Cargo.lock | grep -qx "version = \"${next}\""
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "chore: release v${next}"
            # A push that lands in between makes this fail; the next run
            # computes the same version on top of it and tries again.
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "releasing v${next}"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    # Backstop for a step that hangs; a healthy build takes about 20 minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - &check-version
        name: Check the checked-out version
        if: needs.version.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          want="${{ needs.version.outputs.version }}"
          have=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          lock=$(grep -A1 -x 'name = "candlewick"' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          for found in "$have" "$lock"; do
            if [[ "$found" != "$want" ]]; then
              echo "::error::releasing ${want}, but the checkout says ${found}"
              exit 1
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: x86_64-pc-windows-msvc

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build installer
        env:
          # The packager's `before-packaging-command` builds this target too.
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
        run: cargo packager --release --target x86_64-pc-windows-msvc

      # The upload takes seconds when it works; when the connection stalls,
      # the action neither fails nor returns, so the bound comes from here.
      - name: Upload installer
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: candlewick-x86_64-pc-windows-msvc
          retention-days: 7
          path: target/x86_64-pc-windows-msvc/release/candlewick_*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - *check-version

      # A release must be signed and notarized: an unsigned DMG is one
      # Gatekeeper calls damaged. Say which secret is missing instead of
      # letting the bundler fail on an empty certificate.
      - name: Check the signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID CARGO_PACKAGER_SIGN_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::the release environment has no ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: aarch64-apple-darwin

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # codesign asks trustd to chain the certificate up to Apple's root, and
      # trustd does not take the intermediate from the temporary keychain
      # made from the p12. Without it in the login keychain the signature
      # fails with "unable to build chain to self-signed root". It is Apple's
      # public Developer ID G2 CA, fetched from Apple; verify-cert proves it
      # chains to the Apple Root CA in the system trust store.
      - name: Install Apple's intermediate certificate
        shell: bash
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 -o "$cert" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          keychain="$HOME/Library/Keychains/login.keychain-db"
          security verify-cert -c "$cert" -p basic
          # add-certificates exits 1 when the certificate is already there.
          security add-certificates -k "$keychain" "$cert" || true
          security find-certificate -c "Developer ID Certification Authority" "$keychain" >/dev/null

      # cargo-packager imports the p12 into a throwaway keychain, signs
      # every binary with the hardened runtime, notarizes and staples the
      # app, then builds and signs the DMG. It reads the certificate and the
      # notarization credentials from the environment, but the signing
      # identity only from the config, so the step writes it there first.
      # The secrets reach this step alone.
      - name: Build installer
        timeout-minutes: 40
        shell: bash
        env:
          # The packager's `before-packaging-command` builds this target too.
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          path = "Cargo.toml"
          anchor = "[package.metadata.packager.macos]\n"
          text = open(path).read()
          assert anchor in text, "the packager's macOS table moved"
          line = "signing-identity = " + json.dumps(os.environ["APPLE_SIGNING_IDENTITY"]) + "\n"
          open(path, "w").write(text.replace(anchor, anchor + line, 1))
          PY
          # create-dmg lays the window out with Finder unless CI is set; the
          # hosted Mac can do that, so keep the layout.
          env -u CI cargo packager --release --target aarch64-apple-darwin --formats app,dmg

      # cargo-packager notarizes and staples the app; the DMG it builds is
      # signed but not notarized, so it gets its own submission and ticket.
      - name: Notarize and verify the DMG
        timeout-minutes: 30
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle="target/aarch64-apple-darwin/release"
          app="$bundle/Candlewick.app"
          dmgs=("$bundle"/Candlewick_*.dmg)
          [[ ${#dmgs[@]} -eq 1 && -s "${dmgs[0]}" ]]
          dmg="${dmgs[0]}"

          # Apple publishes a ticket shortly after accepting the upload, so a
          # staple right after can lose that race; retry instead.
          staple() {
            for attempt in 1 2 3 4 5; do
              xcrun stapler staple "$1" && return 0
              [[ "$attempt" -lt 5 ]] && { echo "stapling $1 failed (attempt ${attempt}), retrying in 30s"; sleep 30; }
            done
            echo "::error::could not staple a notarization ticket onto $1"
            return 1
          }

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"

          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          result="$RUNNER_TEMP/dmg-notarization.json"
          submit_status=0
          xcrun notarytool submit "$dmg" "${auth[@]}" \
            --wait --timeout 20m --output-format json > "$result" || submit_status=$?
          cat "$result"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$result")
          if [[ "$submit_status" -ne 0 || "$status" != "Accepted" ]]; then
            submission=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$result")
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${auth[@]}" || true
            fi
            echo "::error::DMG notarization did not finish with Accepted"
            exit 1
          fi
          staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          # What the user drags out of the DMG. The packager stapled it
          # before building the DMG; check the ticket came along.
          mount="$RUNNER_TEMP/candlewick-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Candlewick.app"
          spctl --assess --type execute --verbose=2 "$mount/Candlewick.app"
          xcrun stapler validate "$mount/Candlewick.app"

      # The packager archives the stapled app and signs the archive with the
      # updater key when it packages; check what users will download.
      - name: Check the update archive
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/aarch64-apple-darwin/release"
          update="$bundle/Candlewick.app.tar.gz"
          test -s "$update" && test -s "$update.sig"
          check=$(mktemp -d "$RUNNER_TEMP/update.XXXXXX")
          tar -xzf "$update" -C "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Candlewick.app"
          xcrun stapler validate "$check/Candlewick.app"
          spctl --assess --type execute --verbose=2 "$check/Candlewick.app"

      - name: Upload installer
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: candlewick-aarch64-apple-darwin
          retention-days: 7
          path: |
            target/aarch64-apple-darwin/release/Candlewick_*.dmg
            target/aarch64-apple-darwin/release/Candlewick.app.tar.gz
            target/aarch64-apple-darwin/release/Candlewick.app.tar.gz.sig
          if-no-files-found: error

  # The release and its tag come last: a tag means the installers are there.
  # A run that dies before this point leaves the version in the files
  # untagged, and the next run ships it again rather than bumping.
  publish:
    name: Publish the release
    needs: [version, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The updater key signs the Windows installer here.
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: candlewick-*
          path: built
          merge-multiple: true

      # The installers under their release names, the updater's manifest
      # (latest.json: each platform's package, its signature and its format),
      # and the notes: the app's commits since the previous release, how to
      # install, and the checksums. The platform keys and formats are
      # cargo-packager-updater's: `macos-aarch64` with `app` and
      # `windows-x86_64` with `nsis`; src/update.rs holds the public key that
      # checks these signatures.
      - name: Assemble the release
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          built_dmg=$(find built -type f -name '*.dmg')
          built_app=$(find built -type f -name 'Candlewick.app.tar.gz')
          app_sig=$(find built -type f -name 'Candlewick.app.tar.gz.sig')
          built_exe=$(find built -type f -name '*-setup.exe')
          # Exactly one of each: two would be one path with a newline in it.
          for f in "$built_dmg" "$built_app" "$app_sig" "$built_exe"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::the build output is not one DMG, one update and one installer"
              find built -type f
              exit 1
            fi
          done
          dmg="Candlewick_${VERSION}_aarch64.dmg"
          app="Candlewick_${VERSION}_aarch64.app.tar.gz"
          exe="Candlewick_${VERSION}_x64-setup.exe"
          mkdir release
          cp "$built_dmg" "release/$dmg"
          cp "$built_app" "release/$app"
          cp "$built_exe" "release/$exe"
          # The installer doubles as the updater's package on Windows.
          cargo packager signer sign "release/$exe"
          exe_sig="release/$exe.sig"

          previous=$(git describe --tags --abbrev=0 --match 'v*' "${SHA}^" 2>/dev/null || true)
          # shellcheck disable=SC2086
          changes=$(git log "${previous:+${previous}..}${SHA}" --no-merges --invert-grep \
            --grep='^chore: release v' --format='- %s' -- $APP_PATHS)

          base="https://github.com/${GH_REPO}/releases/download/v${VERSION}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$changes" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$base/$app" --rawfile mac_sig "$app_sig" \
            --arg win "$base/$exe" --rawfile win_sig "$exe_sig" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "macos-aarch64": {url: $mac, signature: ($mac_sig | rtrimstr("\n")), format: "app"},
                "windows-x86_64": {url: $win, signature: ($win_sig | rtrimstr("\n")), format: "nsis"}
              }
            }' > release/latest.json
          rm "$exe_sig"
          cat release/latest.json

          {
            if [[ -n "$changes" ]]; then
              printf '%s\n\n' "$changes"
            fi
            cat <<EOF
          ## 安装

          macOS：下载 \`${dmg}\`，打开后把 Candlewick 拖进「应用程序」。需要 macOS 15 或更高，仅支持 Apple 芯片的 Mac。安装包用 Developer ID 签名并经过苹果公证，双击即可打开。

          Windows：下载 \`${exe}\`，双击安装，不需要管理员权限。需要 Windows 10 或 11。安装包暂未签名，第一次运行时如果出现「Windows 已保护你的电脑」，点「更多信息」再点「仍要运行」。

          已安装的 Candlewick 会自动更新到这个版本，\`latest.json\` 和 \`.app.tar.gz\` 是给它用的，不需要手动下载。

          SHA-256：
          EOF
            for f in "$dmg" "$exe"; do
              # shellcheck disable=SC2016 # Markdown backticks, not a command
              printf -- '- `%s`：`%s`\n' "$f" "$(sha256sum "release/$f" | cut -d' ' -f1)"
            done
          } > notes.md
          cat notes.md

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          # A draft left by a run that died mid-upload would block the name.
          if [[ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
            gh release delete "v${VERSION}" --yes
          fi
          gh release create "v${VERSION}" release/* \
            --target "$SHA" --title "Candlewick ${VERSION}" --notes-file notes.md --latest
          [[ $(gh release view "v${VERSION}" --json assets --jq '.assets | length') -eq 4 ]]
          echo "published https://github.com/${GH_REPO}/releases/tag/v${VERSION}"
