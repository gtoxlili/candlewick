[package]
name = "candlewick"
version = "0.8.19"
description = "Live crypto and stock prices in the macOS menu bar and the Windows taskbar"
repository = "https://github.com/gtoxlili/candlewick"
keywords = ["menu-bar", "taskbar", "crypto", "stocks"]
edition = "2024"
rust-version = "1.98"
publish = false

[features]
# What the native regression test needs: the headless renderer and the menu-bar
# checks, compiled into the library only when asked for.
test-support = ["gpui-kit/test-support"]

[[test]]
name = "macos_bar"
path = "tests/macos_bar.rs"
# AppKit must run on the process's main thread, not a libtest worker.
harness = false
required-features = ["test-support"]

[build-dependencies]
ureq = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
tar = "0.4"
serde_json = "1"
embed-resource = "3"

[dependencies]
gpui-kit = { version = "0.9", default-features = false, features = ["gpui-fast", "component", "assets"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
log = "0.4"
# `process`: thsdk's helper (market/ths/thsdk.rs).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The TLS config comes from net.rs (ring, platform verifier), so no provider here.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "json"] }
# Longbridge's quote socket: protobuf bodies, sometimes gzipped; ring (already
# rustls' crypto) signs its REST requests.
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
# Exchange API signatures (OKX) are base64; reqwest already builds it in.
base64 = "0.23"
# The local API agents read through (agent/api.rs); hyper and tower already
# come with reqwest.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
sys-locale = "0.3"
dirs = "6"
cargo-packager-updater = { version = "0.2.3", default-features = false }
minisign-verify = "0.2"

# The status item uses AppKit; Windows draws its own (platform/windows). A
# downloaded update is unpacked and swapped in on macOS only (update/install.rs).
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
tar = "0.4"
tempfile = "3"
tray-icon = { version = "0.25", default-features = false }
png = "0.18"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSAttributedString", "NSDictionary", "NSError", "NSNotification",
    "NSObject", "NSOperation", "NSRange", "NSString", "NSURL", "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSColorList", "NSAttributedString", "NSButton",
    "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSImage", "NSMenu", "NSMenuItem",
    "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem",
    "NSStringDrawing", "NSText", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFArray", "CFDictionary", "CFNumber", "CFString",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std", "objc2", "objc2-foundation", "SMAppService",
] }
objc2-system-configuration = { version = "0.3", default-features = false, features = [
    "std", "SCDynamicStore", "SCDynamicStoreCopySpecific", "SCSchemaDefinitions",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry",
    "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
windows-version = "0.100"

[package.metadata.packager]
product-name = "Candlewick"
identifier = "com.influo.candlewick"
category = "Finance"
copyright = "© 2026 Hangzhou Healing Era Technology Co., Ltd"
publisher = "Hangzhou Healing Era Technology Co., Ltd"
before-packaging-command = "cargo build --release"
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
    "icons/icon.png",
]
# The crate's only binary; naming it keeps the bundle's executable stable
# whatever else cargo generates.
binaries = [{ path = "candlewick", main = true }]
# `hq.dll` exists only when building for Windows, so the glob is empty on
# macOS; the license ships on both.
resources = [
    { src = "thsdk/*.dll", target = "." },
    { src = "thsdk/LICENSE", target = "thsdk-LICENSE.txt" },
]

[package.metadata.packager.macos]
minimum-system-version = "15.0"
background-app = true
info-plist-path = "Info.plist"
# Lands in Contents/Frameworks, where src/market/ths/thsdk.rs looks for it.
frameworks = ["thsdk/hq.dylib"]

[package.metadata.packager.nsis]
installMode = "currentUser"
languages = ["English", "SimpChinese", "Japanese"]
installer-icon = "icons/icon.ico"
# cargo-packager's template has no uninstall hook, so the callback it leaves
# undefined does the cleanup. Runs only after a successful uninstall; the
# installer's uninstall-before-install flow passes `_?=` and keeps the values.
preinstall-section = '''
Function un.onUninstSuccess
  ${GetOptions} $CMDLINE "_?=" $R0
  IfErrors 0 candlewick_keep_login_item
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "${PRODUCTNAME}"
    DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run" "${PRODUCTNAME}"
candlewick_keep_login_item:
FunctionEnd
'''

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[dev-dependencies]
gpui-kit = { version = "0.9", default-features = false, features = ["gpui-fast", "component", "assets", "test-support"] }
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Turns the feature on for `cargo test` without a flag.
candlewick = { path = ".", features = ["test-support"] }
