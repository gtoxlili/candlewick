[package]
name = "candlewick"
version = "0.8.1"
description = "Live crypto and stock prices in the macOS menu bar and the Windows taskbar"
repository = "https://github.com/gtoxlili/candlewick"
homepage = "https://github.com/gtoxlili/candlewick"
keywords = ["menu-bar", "taskbar", "crypto", "stocks", "tauri"]
edition = "2024"
rust-version = "1.98"
publish = false

[[test]]
name = "macos_bar"
path = "tests/macos_bar.rs"
# AppKit must run on the process's main thread, not a libtest worker.
harness = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `macos-private-api` matches `app.macOSPrivateApi`, which tauri-build checks on
# every platform; it does nothing on Windows.
tauri = { version = "2.12", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The TLS config comes from net.rs (ring, platform verifier), so no provider here.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "json"] }
# Longbridge's quote socket: protobuf bodies, sometimes gzipped; ring (already
# rustls' crypto) signs its REST requests.
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
tauri-plugin-updater = "2"

# The status item is Tauri's tray icon; Windows draws its own (platform/windows).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
# Match Tauri's tray backend so the native menu can be owned independently
# of NSStatusItem.menu, which is only attached while the dropdown is open.
tray-icon = { version = "0.25", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSAttributedString", "NSDictionary", "NSError", "NSNotification",
    "NSObject", "NSOperation", "NSRange", "NSString", "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSApplication", "NSAttributedString", "NSButton",
    "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSImage", "NSMenu", "NSMenuItem",
    "NSParagraphStyle", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem",
    "NSStringDrawing", "NSText", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFArray", "CFDictionary", "CFNumber", "CFString",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std", "objc2", "objc2-foundation", "SMAppService",
] }
objc2-system-configuration = { version = "0.3", default-features = false, features = [
    "std", "SCDynamicStore", "SCDynamicStoreCopySpecific", "SCSchemaDefinitions",
] }

# The versions Tauri's wry is built on (windows, webview2-com, and the
# windows-numerics that windows uses), so window handles, WebView2 interfaces
# and Direct2D's vectors are the same types.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry",
    "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
windows-version = "0.100"
webview2-com = "0.39"

# Measured on this app: opt-level 3 grew the binary 20% (4.0 → 4.8 MB) with the
# same 15 MB footprint and no CPU difference, so optimize for size. trim-paths and
# panic = "immediate-abort" would help further but are nightly-only in Cargo 1.98.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
