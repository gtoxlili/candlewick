[package]
name = "candlewick"
version = "0.4.1"
description = "Live crypto and stock prices in the macOS menu bar"
repository = "https://github.com/gtoxlili/candlewick"
homepage = "https://github.com/gtoxlili/candlewick"
keywords = ["macos", "menu-bar", "crypto", "stocks", "tauri"]
edition = "2024"
rust-version = "1.98"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The TLS config comes from net.rs (ring, platform verifier), so no provider here.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "json"] }
# Longbridge's quote socket: protobuf bodies, sometimes gzipped; ring (already
# rustls' crypto) signs its REST requests.
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSAttributedString", "NSDictionary", "NSError", "NSNotification",
    "NSObject", "NSOperation", "NSRange", "NSString", "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "NSApplication", "NSAttributedString", "NSButton",
    "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSImage", "NSMenu", "NSMenuItem",
    "NSParagraphStyle", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem",
    "NSStringDrawing", "NSText", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFArray", "CFDictionary", "CFNumber", "CFString",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std", "objc2", "objc2-foundation", "SMAppService",
] }
objc2-system-configuration = { version = "0.3", default-features = false, features = [
    "std", "SCDynamicStore", "SCDynamicStoreCopySpecific", "SCSchemaDefinitions",
] }

# Measured on this app: opt-level 3 grew the binary 20% (4.0 → 4.8 MB) with the
# same 15 MB footprint and no CPU difference, so optimize for size. trim-paths and
# panic = "immediate-abort" would help further but are nightly-only in Cargo 1.98.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
